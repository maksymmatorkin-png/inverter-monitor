name: Сторож мониторинга

# Страховка: если цепочка запусков мониторинга оборвалась, запускает её снова.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Перезапустить мониторинг, если он не работает
        run: |
          active=$(gh run list --workflow monitor.yml --limit 10 --json status \
            --jq '[.[] | select(.status != "completed")] | length')
          echo "Активных запусков мониторинга: $active"
          if [ "$active" -eq 0 ]; then
            gh workflow run monitor.yml --ref "${{ github.event.repository.default_branch }}" -f send_status=false
            echo "Мониторинг перезапущен"
          fi
