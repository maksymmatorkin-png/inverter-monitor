name: Мониторинг инвертора

# Непрерывный режим: запуск работает около 25 минут, проверяет инвертор каждые 2 минуты
# и в конце сам запускает следующий. Расписанию GitHub доверять нельзя (задержки до часа),
# поэтому оно используется только в watchdog.yml как страховка.
on:
  workflow_dispatch:
    inputs:
      send_status:
        description: "Прислать в Telegram текущий статус"
        type: boolean
        default: true

permissions:
  contents: write   # keepalive-коммит
  actions: write    # запуск следующего звена, удаление старых кэшей

# Одновременно работает только один запуск: состояние общее.
concurrency:
  group: inverter-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: pip install --quiet -r requirements.txt

      - name: Восстановить состояние
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: inverter-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            inverter-state-

      - name: Проверять инвертор
        id: check
        env:
          LUX_ACCOUNT: ${{ secrets.LUX_ACCOUNT }}
          LUX_PASSWORD: ${{ secrets.LUX_PASSWORD }}
          LUX_SERIAL: ${{ secrets.LUX_SERIAL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SITE_NAME: ${{ vars.SITE_NAME }}
          SEND_STATUS: ${{ inputs.send_status }}
          PORTAL_FAIL_ALERT: "8"   # 8 проверок по 2 минуты = около 15 минут без портала
        run: |
          args="--loop 25 --interval 120"
          if [ "$SEND_STATUS" = "true" ]; then
            args="$args --status"
          fi
          python -u monitor.py $args

      - name: Сохранить состояние
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: inverter-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Удалить старые кэши состояния
        if: always()
        continue-on-error: true
        run: |
          # оставляем два самых свежих
          gh cache list --key inverter-state- --sort created_at --order desc --limit 100 \
            --json id --jq '.[2:][].id' |
          while read -r id; do
            gh cache delete "$id" || true
          done

      - name: Keepalive
        # GitHub отключает расписание в публичных репозиториях без активности 60 дней
        continue-on-error: true
        run: |
          days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Последний коммит: $days дн. назад"
          if [ "$days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: расписание остаётся активным"
            git push
          fi

      - name: Запустить следующее звено
        # Только после успешной проверки: при ошибке настройки цепочка не должна крутиться вхолостую,
        # её перезапустит watchdog.
        if: always() && steps.check.outcome == 'success'
        run: gh workflow run monitor.yml --ref "${{ github.ref_name }}" -f send_status=false
